[project]
name = "holochain_cert"
version = "0.1.0"
description = "Re-structured HoloChain-Cert experimental code base"
readme = "README.md"
requires-python = ">=3.10"

# NOTE: list-style ``dependencies`` is required by the task description.
dependencies = [
  "numpy>=1.21.0",
  "torch>=1.9.0",
  "transformers>=4.36.0",
  "datasets>=2.18.0",
  "tqdm>=4.66.0",
  "matplotlib>=3.5.0",
  "scikit-learn>=1.1.0",
  "requests>=2.31.0",
  "pyyaml>=6.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
