[project]
name = "haguard-demo"
version = "0.0.1"
description = "Minimal runnable subset of the HAGuard research codebase"
authors = [ { name = "OpenAI", email = "research@example.com" } ]
requires-python = ">=3.10"
# ------------------------------------------------------------------
#  Core dependencies – kept intentionally minimal. Heavy libraries are
#  moved to the optional "full" extra to avoid resolution issues on
#  Python versions where wheels may be unavailable (e.g. 3.12).
# ------------------------------------------------------------------
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "torch>=2.0"
]

[project.optional-dependencies]
full = [
  "lightgbm>=4.0",
  "transformers>=4.38",
  "onnxruntime>=1.17",
  "faiss-cpu>=1.7.4",
  # bloom-filter2 wheels >2.0 are currently missing for Python 3.12.
  # Version 2.0.0.post1 provides the required API across 3.10–3.12.
  "bloom-filter2<=2.0.0.post1"
]

[build-system]
requires = ["setuptools >= 67", "wheel"]
build-backend = "setuptools.build_meta"
