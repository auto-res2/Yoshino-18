experiments:
  exp1_long_context:
    active: true
    model_hf_id: mistralai/Mixtral-8x7B-Instruct-v0.1
    ours_wrapper: true
    dataset:
      name: HarmBench_Long
      hf_repo: SafetyResearch/HarmBench
      split: train
      filter_longform: true
    extra_datasets:
      - {name: MultiLingualAdvBench,  hf_repo: SafetyResearch/MLAdvBench}
      - {name: OpenWebHal,            hf_repo: SafetyResearch/OpenWebHal}
    decoding:
      temperatures: [0.7, 1.0, 1.2]
      top_ps: [0.8, 0.9]
      beams: [1, 5]
      max_new_tokens: [512, 4096]
    training:
      epochs: 3
      micro_batch_size: 4
      grad_accum: 8
      lr: 1.5e-5
      dads:
        sigma: 0.12
        steps: 4

  exp2_exdar_stress:
    active: true
    model_hf_id: mistralai/Mixtral-8x7B-Instruct-v0.1
    ours_wrapper: true
    dataset:
      name: UltraChat
      hf_repo: OpenAssistant/UltraChat
      split: train
      limit: null
    adversarial_dataset:
      name: SingleExpertAdv
      url: https://huggingface.co/datasets/SafetyResearch/SingleExpertAdvAttack
    exdar:
      dirichlet_alpha_grid: [0.1, 1.0, 10.0]
      votes_grid: [1, 3, 5]
      router_tau_grid: [1.0, 0.7, 0.3]

  exp3_edge_bums:
    active: true
    model_hf_id: TinyLlama/TinyLlama-1.1B-Chat-v0.6
    ours_wrapper: true
    dataset:
      name: HarmBench+UltraChat
      hf_repo: SafetyResearch/HarmBench
    second_hf_repo: OpenAssistant/UltraChat
    bums:
      episodes: 1000
      ppo_lr: 3e-4
      reward_penalty_vram: 50
      reward_penalty_latency: 20
